<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | WEEKLY JANOON</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="brand-title">WEEKLY JANOON</div>
      <div class="brand-sub">ADMIN PANEL &middot; آپ کی آواز، آپ کی خبر</div>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <div class="login-hint" id="loginHint"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/data.js"></script>
<script src="js/admin-data.js"></script>
<script>
// If already signed in, skip straight to the dashboard.
WJ.admin.onAuthChange(user=>{ if (user) location.href = "dashboard.html"; });

document.getElementById("loginHint").innerHTML = window.firebaseEnabled
  ? "Connected to Firebase — sign in with an admin account created in Firebase Authentication."
  : "Demo mode (Firebase not configured yet): <b>admin@weeklyjanoon.com</b> / <b>demo12345</b>. Connect Firebase in <code>assets/js/firebase-config.js</code> to go live.";

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errBox = document.getElementById("loginError");
  errBox.classList.remove("show");
  btn.disabled = true; btn.textContent = "Signing in...";
  try{
    await WJ.admin.login(document.getElementById("email").value.trim(), document.getElementById("password").value);
    location.href = "dashboard.html";
  }catch(err){
    errBox.textContent = err.message || "Login failed. Please check your credentials.";
    errBox.classList.add("show");
    btn.disabled = false; btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
