<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ای پیپر | WEEKLY JANOON</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="container">
    <p class="breadcrumb"><a href="index.html">صفحہ اوّل</a> / ای پیپر</p>
    <div class="section-head" style="margin-top:6px">
      <h2>ای پیپر — ویکلی جنون</h2>
    </div>

    <div class="epaper-hero" id="epaperHero">
      <div class="loading-state">ای پیپر لوڈ ہو رہا ہے…</div>
    </div>

    <div class="section-head">
      <h2>پرانے شمارے (آرکائیو)</h2>
    </div>
    <ul class="epaper-archive-list" id="archiveList"></ul>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
var epapers = [];
var currentEdition = 0;
var currentPage = 0;

function isPdf(url){
  var s = String(url || "");
  try { s = decodeURIComponent(s); } catch(e) {}
  return /\.pdf($|\?|#)/i.test(s);
}

function pagesLabel(e){
  var pages = e.pages || [];
  if (pages.length === 1 && isPdf(pages[0])) return "PDF";
  return pages.length + " صفحات";
}

function renderViewer(){
  var hero = document.getElementById("epaperHero");
  if (!epapers.length){
    hero.innerHTML = '<div class="empty-state" style="width:100%">ابھی تک کوئی ای پیپر شائع نہیں ہوا۔</div>';
    return;
  }
  var ed = epapers[currentEdition];
  var pages = ed.pages || [];
  var totalPages = pages.length;
  if (!totalPages){
    hero.innerHTML = '<div class="empty-state" style="width:100%">اس شمارے میں کوئی صفحہ موجود نہیں۔</div>';
    return;
  }
  if (currentPage > totalPages - 1) currentPage = 0;

  var url = pages[currentPage];
  var pdf = isPdf(url);
  var frame = "";
  if (pdf){
    frame = '<iframe src="' + url + '#view=FitH" title="ای پیپر" style="display:block;width:100%;height:80vh;min-height:480px;border:1px solid var(--line);background:#fff;margin-bottom:12px;"></iframe>';
  } else {
    frame = '<div class="page-frame" style="background-image:url(\'' + url + '\')"></div>';
  }

  var nav = "";
  if (totalPages > 1){
    nav = '<div class="epaper-nav">' +
      '<button id="prevPage"' + (currentPage === 0 ? ' disabled' : '') + '>&rarr; پچھلا صفحہ</button>' +
      '<span>صفحہ ' + (currentPage + 1) + ' / ' + totalPages + '</span>' +
      '<button id="nextPage"' + (currentPage === totalPages - 1 ? ' disabled' : '') + '>اگلا صفحہ &larr;</button>' +
      '</div>';
  }

  var btnText = pdf ? "PDF الگ ٹیب میں کھولیں / ڈاؤن لوڈ کریں" : "صفحہ کھولیں / ڈاؤن لوڈ کریں";

  hero.innerHTML =
    '<div class="epaper-viewer">' +
      frame +
      nav +
      '<p style="margin-top:14px;font-size:12.5px;color:var(--ink-soft)">شمارہ: ' + ed.title + ' — ' + WJ.formatDate(ed.date) + '</p>' +
      '<a href="' + url + '" target="_blank" rel="noopener" class="btn" style="display:inline-block;margin-top:10px;background:var(--maroon);color:#fff;padding:8px 18px;font-size:13px;">' + btnText + '</a>' +
    '</div>' +
    '<div class="epaper-side">' +
      '<h3>ایڈیشن منتخب کریں</h3>' +
      '<ul class="epaper-archive-list" id="editionList"></ul>' +
    '</div>';

  var prev = document.getElementById("prevPage");
  if (prev) prev.addEventListener("click", function(){ currentPage = Math.max(0, currentPage - 1); renderViewer(); });
  var next = document.getElementById("nextPage");
  if (next) next.addEventListener("click", function(){ currentPage = Math.min(totalPages - 1, currentPage + 1); renderViewer(); });

  var editionList = document.getElementById("editionList");
  editionList.innerHTML = epapers.map(function(e, i){
    return '<li>' +
      '<span>' + e.title + ' — ' + WJ.formatDate(e.date) + '</span>' +
      '<button class="dl" style="background:none;border:1px solid var(--maroon);color:var(--maroon);padding:4px 10px;font-size:12px;" data-i="' + i + '">دیکھیں</button>' +
    '</li>';
  }).join("");
  editionList.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      currentEdition = parseInt(b.dataset.i, 10);
      currentPage = 0;
      renderViewer();
    });
  });
}

function renderArchive(){
  var list = document.getElementById("archiveList");
  list.innerHTML = epapers.map(function(e, i){
    return '<li>' +
      '<span>📰 ' + e.title + ' — ' + WJ.formatDate(e.date) + ' (' + pagesLabel(e) + ')</span>' +
      '<a class="dl" href="#" data-i="' + i + '">پورا ایڈیشن دیکھیں</a>' +
    '</li>';
  }).join("");
  list.querySelectorAll("a.dl").forEach(function(a){
    a.addEventListener("click", function(ev){
      ev.preventDefault();
      currentEdition = parseInt(a.dataset.i, 10);
      currentPage = 0;
      renderViewer();
      window.scrollTo({top: 0, behavior: "smooth"});
    });
  });
}

async function init(){
  renderHeader();
  renderFooter();
  epapers = await WJ.db.getEpapers();
  renderViewer();
  renderArchive();
}
init();
</script>
</body>
</html>
